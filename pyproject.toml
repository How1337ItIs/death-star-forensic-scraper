[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "death-star-scraper"
version = "3.0.0"
description = "Ultimate all-purpose web scraper for forensic analysis and research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Deadhead-LLM Project", email = "dev@example.com"}
]
keywords = [
    "web-scraper",
    "forensic",
    "archival",
    "warc",
    "har",
    "playwright",
    "research",
    "data-extraction",
    "wayback-machine"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "trafilatura>=1.6.0",
    "html2text>=2024.2.0",
    "warcio>=1.7.0",
    "yt-dlp>=2024.1.0",
    "extruct>=0.17.0",
    "readability-lxml>=0.8.0",
    "markdownify",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
stealth = [
    "playwright>=1.40.0",
    "curl_cffi>=0.7.0",
    "browserforge>=1.0.0",
    "browser-cookie3",
    "capsolver",
]
full = [
    "playwright>=1.40.0",
    "curl_cffi>=0.7.0",
    "browserforge>=1.0.0",
    "browser-cookie3",
    "capsolver",
    "Pillow>=10.0.0",
    "dnspython>=2.4.0",
    "selectolax",
    "newspaper4k",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/death-star-scraper"
Documentation = "https://github.com/yourorg/death-star-scraper#readme"
Repository = "https://github.com/yourorg/death-star-scraper"
Issues = "https://github.com/yourorg/death-star-scraper/issues"

[project.scripts]
death-star = "death_star.cli:main"
ds-scrape = "death_star.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["death_star*"]

[tool.setuptools.package-data]
death_star = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
