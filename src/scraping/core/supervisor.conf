; Supervisor Configuration for SOL-CANNABIS Scrapers
; ==============================================
;
; This config manages long-running scrapers with auto-restart on crash.
;
; Install: pip install supervisor
;
; Usage:
;   supervisord -c src/scraping/core/supervisor.conf
;   supervisorctl -c src/scraping/core/supervisor.conf status
;   supervisorctl -c src/scraping/core/supervisor.conf restart all
;
; Logs go to: data/logs/scrapers/

[supervisord]
logfile = data/logs/scrapers/supervisord.log
logfile_maxbytes = 50MB
logfile_backups = 10
loglevel = info
pidfile = /tmp/supervisord_scrapers.pid
nodaemon = false

[unix_http_server]
file = /tmp/supervisor_scrapers.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///tmp/supervisor_scrapers.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================================
; SCRAPER PROGRAMS (Configure for your project)
; ============================================================================
;
; Template for adding scrapers:
;
; [program:your_scraper_name]
; command = python src/scraping/your_scraper.py
; directory = /path/to/sol-cannabis
; autostart = false
; autorestart = unexpected
; exitcodes = 0
; startretries = 3
; stopwaitsecs = 30
; stopsignal = TERM
; stderr_logfile = data/logs/scrapers/your_scraper.err.log
; stdout_logfile = data/logs/scrapers/your_scraper.out.log
; stderr_logfile_maxbytes = 10MB
; stdout_logfile_maxbytes = 10MB
;
; Example forum scraper:
; [program:forum_scraper]
; command = python src/scraping/forums/your_forum_scraper.py
; directory = /path/to/sol-cannabis
; autostart = false
; autorestart = unexpected
; exitcodes = 0
; stderr_logfile = data/logs/scrapers/forum_scraper.err.log
; stdout_logfile = data/logs/scrapers/forum_scraper.out.log

; ============================================================================
; HEALTH CHECK (Configure for your project)
; ============================================================================
;
; [program:scraper_health]
; command = python src/scraping/utilities/health_check.py
; directory = /path/to/sol-cannabis
; autostart = false
; autorestart = true
; startretries = 999
; stderr_logfile = data/logs/scrapers/health.err.log
; stdout_logfile = data/logs/scrapers/health.out.log

; ============================================================================
; NOTES
; ============================================================================
;
; To add a new scraper:
; 1. Create the scraper script in appropriate directory
; 2. Add [program:xxx] section above
; 3. Set autostart=true if should run on supervisor start
; 4. Set autorestart=unexpected to restart on crashes (not clean exit)
;
; Best practices:
; - Use SIGTERM for graceful shutdown (scrapers save checkpoint)
; - Set exitcodes=0 so only unexpected exits trigger restart
; - Keep logs with maxbytes rotation
; - Use environment for PYTHONPATH
